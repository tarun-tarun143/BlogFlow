<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BlogFlow — a modern full-stack blog publishing workspace.">
  <title>BlogFlow — Publish with clarity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="aurora aurora-a" aria-hidden="true"></div>
  <div class="aurora aurora-b" aria-hidden="true"></div>
  <div class="grid-noise" aria-hidden="true"></div>

  <header class="site-header glass-panel">
    <a class="brand" href="#/" aria-label="BlogFlow home">
      <span class="brand-mark">B</span>
      <span><strong>BlogFlow</strong><small>publish with clarity</small></span>
    </a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="#/" data-nav="home">Explore</a>
      <a href="#/new" data-nav="new" class="nav-new">Write</a>
      <button id="authButton" class="button button-glass" type="button">Sign in</button>
      <button id="themeButton" class="icon-button" type="button" aria-label="Toggle theme" title="Toggle theme">◐</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <footer class="site-footer">
    <span>BlogFlow</span>
    <span>Full-stack publishing workflow</span>
    <span id="year"></span>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
